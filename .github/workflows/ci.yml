name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. The source parses.
      - name: syntax
        run: |
          for f in src/*.js tools/*.mjs; do node --check "$f"; done

      # 2. The CDN artifact must not drift from source. decoder-worker.js,
      #    demux.js and paint.js in dist/ are straight copies of src/ (see
      #    tools/build.sh); if they differ, someone edited src without
      #    rebuilding and jsDelivr would serve a stale worker.
      - name: dist is in sync with src
        run: |
          fail=0
          for f in decoder-worker.js demux.js paint.js; do
            if ! diff -u "src/$f" "dist/$f"; then
              echo "::error file=dist/$f::out of sync with src/$f — run tools/build.sh"
              fail=1
            fi
          done
          exit $fail

      # 3. The shipped wasm actually decodes H.265. Generate a small stream and
      #    decode it with dist/de265.js — the exact file the CDN serves — so a
      #    broken build fails here rather than on a camera.
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: generate a fixture
        run: >
          ffmpeg -v error -f lavfi
          -i testsrc=size=1280x720:rate=5:duration=2
          -c:v libx265 -x265-params log-level=error -f hevc test-720p.h265

      - name: decode smoke test (shipped dist artifact)
        run: node tools/smoke.mjs test-720p.h265 1280 720
