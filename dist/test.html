<!doctype html><meta charset=utf-8><title>hevc-wasm</title>
<style>body{background:#111;color:#ddd;font:13px system-ui;margin:0}
canvas{width:100%;max-width:1280px;display:block;background:#000}
pre{padding:8px;margin:0;white-space:pre-wrap;line-height:1.6}</style>
<canvas id=c></canvas><pre id=log>starting…</pre>
<script type=module>
// Minimal driver: point it at a camera's /ws/video and watch the numbers. Same
// worker the WebUI uses, without any of the page around it. With ?feed=ws the
// PAGE owns the socket and feeds the worker message by message — the byte
// compatibility check for the feed mode a data-channel page uses, against a
// transport every camera has.
const log = document.getElementById('log'), lines = {};
const show = () => log.textContent = Object.entries(lines).map(([k, v]) => k + ': ' + v).join('\n');
const canvas = document.getElementById('c');
const w = new Worker(new URL('./decoder-worker.js', import.meta.url), { type: 'module' });
const off = canvas.transferControlToOffscreen();
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
w.onmessage = (e) => {
  const m = e.data;
  if (m.type === 'state') lines.state = m.state + (m.detail ? ' (' + m.detail + ')' : '');
  else if (m.type === 'codec') lines.codec = m.codec + ' ' + m.width + 'x' + m.height;
  else if (m.type === 'stats') {
    const s = m.stats;
    lines.stats = 'decoded ' + s.frames + ' · dropped ' + s.dropped +
      ' · gopDrops ' + s.gopDrops + ' · idrReq ' + s.idrRequests +
      ' · queued ' + s.queuedFrames + ' (' + s.queuedMs + 'ms)' +
      ' · source interval ' + s.sourceIntervalMs + 'ms' +
      (s.feed ? ' · feed' : '') + (s.gaps ? ' · gaps ' + s.gaps : '') +
      (s.lag && s.lag.n ? ' · capture→paint p50 ' + s.lag.p50 + 'ms p95 ' + s.lag.p95 + 'ms' : '');
  }
  else if (m.type === 'feed') lines.feed = 'acknowledged, protocol ' + m.protocol;
  else if (m.type === 'send' && ws && ws.readyState === 1) ws.send(m.text);
  show();
};
const params = new URLSearchParams(location.search);
const url = proto + '://' + location.host + '/ws/video?stream=' + (params.get('stream') || 0);
let ws = null;
if (params.get('feed') === 'ws') {
  w.postMessage({ type: 'start', feed: true, url, canvas: off }, [off]);
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  let first = true;
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') { w.postMessage({ type: 'msg', data: e.data }); return; }
    // The socket says nothing about which binary message is the init; the
    // first one is. A feed that knows says so with `kind`.
    w.postMessage({ type: 'msg', data: e.data, kind: first ? 2 : 3 }, [e.data]);
    first = false;
  };
  ws.onclose = () => { lines.socket = 'closed'; show(); };
} else {
  w.postMessage({ type: 'start', url, canvas: off }, [off]);
}
setInterval(() => w.postMessage({ type: 'stats' }), 1000);
</script>
